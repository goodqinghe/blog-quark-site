<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>清河的个人博客</title>
    <meta name="description" content="最是人间留不住，朱颜辞镜花辞树">
    <meta name="author" content="清河">
    <link rel="stylesheet" href="/css/highlight.css">
    <style>
        :root {
            --max-width: 720px;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
            --color-text: #1a1a1a;
            --color-muted: #6b7280;
            --color-link: #2563eb;
            --color-border: #e5e7eb;
            --color-bg: #ffffff;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-sans);
            color: var(--color-text);
            background: var(--color-bg);
            line-height: 1.8;
            padding: 2rem 1rem;
            max-width: var(--max-width);
            margin: 0 auto;
        }
        .hero { text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .hero p { color: var(--color-muted); font-size: 1rem; }
        .hero .quote { font-style: italic; margin-top: 1rem; color: var(--color-muted); }
        .nav { margin-bottom: 2rem; }
        .nav a { color: var(--color-link); text-decoration: none; margin-right: 1rem; }
        .nav a:hover { text-decoration: underline; }
        .category { margin-bottom: 2rem; }
        .category h2 {
            font-size: 1.2rem;
            margin-bottom: 0.8rem;
            padding-bottom: 0.3rem;
            border-bottom: 1px solid var(--color-border);
        }
        .article-list { list-style: none; }
        .article-list li {
            padding: 0.5rem 0;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }
        .article-list li:last-child { border-bottom: none; }
        .article-list a { color: var(--color-text); text-decoration: none; font-weight: 500; }
        .article-list a:hover { color: var(--color-link); }
        .article-list .date { color: var(--color-muted); font-size: 0.85rem; white-space: nowrap; margin-left: 1rem; }
        footer { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--color-border); text-align: center; }
        footer p { color: var(--color-muted); font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="hero">
        <h1>清河的个人博客</h1>
        <p class="quote">最是人间留不住，朱颜辞镜花辞树</p>
    </div>

    <div class="nav">
        <a href="/about/">关于我 / 联系方式</a>
    </div>

    
    
    <div class="category">
        <h2>DevOps 实践</h2>
        <ul class="article-list">
            
            <li>
                <a href="/jenkins-kubernetes/">Jenkins 在 Kubernetes 上的搭建</a>
                <span class="date">2026-07-27</span>
            </li>
            
            <li>
                <a href="/jenkins-pipeline/">Jenkins 创建第一个流水线</a>
                <span class="date">2026-07-27</span>
            </li>
            
        </ul>
    </div>
    
    
    
    
    
    
    
    

    <footer>
        <p>&copy; 清河</p>
    </footer>
</body>
</html>
